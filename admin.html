<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alto Lavalle - Administración</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ALTO LAVALLE — PANEL EN ESTILO SKEUOMORPHISM
       Superficies marfil, controles físicos y rojo vino
    ========================================================= */

    :root {
      --vino: #6d1526;
      --vino-claro: #8f2a3f;
      --vino-oscuro: #4a0e1a;
      --marfil: #f6f1e8;
      --marfil-2: #ece4d6;
      --blanco: #fffdf9;
      --tinta: #3a2c27;
      --tinta-suave: #7a6a60;
      --oro: #b6842f;
      --borde-claro: rgba(255, 255, 255, 0.95);
      --borde-oscuro: rgba(86, 62, 40, 0.22);

      --ruido: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .2  0 0 0 .28 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Work Sans', Arial, sans-serif;
      color: var(--tinta);
      background:
        radial-gradient(900px 500px at 15% -5%, #fffaf0, transparent 70%),
        linear-gradient(180deg, #efe8dc, #e4dacb);
      background-attachment: fixed;
      min-height: 100vh;
    }

    h1, h2, h3 {
      font-family: 'Fraunces', serif;
    }

    .contenedor {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 18px 16px 40px;
    }

    /* ---------- Placa de título (cuero vino) ---------- */
    h1 {
      margin: 6px 0 22px;
      padding: 18px 20px;
      text-align: center;
      font-size: clamp(1.25rem, 5vw, 1.7rem);
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fbefe0;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      border: 1px solid var(--vino-oscuro);
      background:
        var(--ruido),
        linear-gradient(180deg, #8a2236 0%, #6d1526 45%, #571020 100%);
      background-blend-mode: soft-light, normal;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        inset 0 -3px 6px rgba(0, 0, 0, 0.25),
        0 2px 0 #3d0b16,
        0 10px 18px rgba(74, 14, 26, 0.32);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.2rem;
      color: var(--vino);
      text-shadow: 0 1px 0 var(--borde-claro);
    }

    /* ---------- Placas marfil (tarjetas) ---------- */
    .tarjeta {
      position: relative;
      margin-bottom: 22px;
      padding: 22px 20px;
      border-radius: 22px;
      border: 1px solid #fff;
      background:
        var(--ruido),
        linear-gradient(160deg, #ffffff 0%, #f5efe4 55%, #ebe2d3 100%);
      background-blend-mode: multiply, normal;
      box-shadow:
        inset 0 1px 0 #fff,
        inset 0 -2px 4px rgba(120, 90, 60, 0.12),
        0 1px 0 rgba(120, 90, 60, 0.25),
        0 14px 26px rgba(90, 64, 40, 0.22),
        0 3px 6px rgba(90, 64, 40, 0.16);
    }

    /* ---------- Etiquetas grabadas ---------- */
    label {
      display: block;
      margin: 10px 0 2px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--tinta-suave);
      text-shadow: 0 1px 0 var(--borde-claro);
    }

    /* ---------- Campos hundidos ---------- */
    input,
    textarea,
    select {
      width: 100%;
      margin: 6px 0 12px;
      padding: 13px 14px;
      font: inherit;
      font-size: 15px;
      color: var(--tinta);
      border-radius: 14px;
      border: 1px solid #cfc2ae;
      border-top-color: #b8a98f;
      background: linear-gradient(180deg, #e8dfd0 0%, #f4eee3 100%);
      box-shadow:
        inset 2px 4px 8px rgba(80, 58, 36, 0.28),
        inset -1px -1px 2px rgba(255, 255, 255, 0.7),
        0 1px 0 #fff;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #a99a89;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--vino-claro);
      box-shadow:
        inset 2px 4px 8px rgba(80, 58, 36, 0.28),
        0 0 0 3px rgba(143, 42, 63, 0.22),
        0 1px 0 #fff;
    }

    textarea {
      resize: vertical;
      min-height: 92px;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 40px;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%236d1526' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>"),
        linear-gradient(180deg, #e8dfd0 0%, #f4eee3 100%);
      background-repeat: no-repeat, no-repeat;
      background-position: right 14px center, 0 0;
    }

    /* ---------- Botones: teclas con relieve ---------- */
    button {
      font-family: 'Work Sans', Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin: 4px;
      padding: 11px 18px;
      border-radius: 13px;
      border: 1px solid transparent;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(3px);
    }

    .btn-principal {
      color: #fff;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.4);
      border-color: var(--vino-oscuro);
      background: linear-gradient(180deg, #a02c43 0%, #6d1526 52%, #561020 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -2px 3px rgba(0, 0, 0, 0.22),
        0 4px 0 #3a0a14,
        0 9px 14px rgba(74, 14, 26, 0.35);
    }

    .btn-principal:active {
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.45),
        0 1px 0 #3a0a14,
        0 3px 6px rgba(74, 14, 26, 0.3);
    }

    .btn-secundario,
    .btn-editar {
      color: var(--vino);
      text-shadow: 0 1px 0 #fff;
      border-color: #cdbfaa;
      background: linear-gradient(180deg, #ffffff 0%, #efe8db 100%);
      box-shadow:
        inset 0 1px 0 #fff,
        inset 0 -2px 3px rgba(120, 90, 60, 0.14),
        0 3px 0 #b9ab95,
        0 8px 12px rgba(90, 64, 40, 0.22);
    }

    .btn-secundario:active,
    .btn-editar:active {
      box-shadow:
        inset 0 2px 5px rgba(90, 64, 40, 0.35),
        0 1px 0 #b9ab95;
    }

    .btn-eliminar {
      color: #ffe9e6;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
      border-color: #2e0710;
      background: linear-gradient(180deg, #6a1a28 0%, #4a0e1a 55%, #380a14 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -2px 3px rgba(0, 0, 0, 0.3),
        0 3px 0 #22050c,
        0 8px 12px rgba(40, 6, 14, 0.35);
    }

    .btn-eliminar:active {
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.55),
        0 1px 0 #22050c;
    }

    #mensaje,
    #mensajeNegocio,
    #mensajePlato {
      margin: 12px 4px 0;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--vino);
      text-shadow: 0 1px 0 var(--borde-claro);
    }

    .botones {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
    }

    /* =========================================================
       LISTA DE PLATOS POR CATEGORÍA
    ========================================================= */

    #buscarPlato {
      margin-bottom: 10px;
    }

    .cat-grupo {
      margin-top: 14px;
      border-radius: 18px;
      border: 1px solid #d9ccb8;
      background: linear-gradient(180deg, #eadfce, #f3ecdf);
      box-shadow:
        inset 0 3px 8px rgba(90, 64, 40, 0.22),
        0 1px 0 #fff;
      overflow: hidden;
    }

    .cat-grupo summary {
      position: relative;
      cursor: pointer;
      list-style: none;
      padding: 15px 52px 15px 18px;
      font-family: 'Fraunces', serif;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--vino);
      text-shadow: 0 1px 0 #fff;
      border-radius: 17px;
      background: linear-gradient(180deg, #ffffff 0%, #f0e9dc 100%);
      box-shadow:
        inset 0 1px 0 #fff,
        inset 0 -2px 3px rgba(120, 90, 60, 0.12),
        0 3px 8px rgba(90, 64, 40, 0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .cat-grupo summary::-webkit-details-marker {
      display: none;
    }

    .cat-grupo summary::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 26px;
      height: 26px;
      margin-top: -13px;
      border-radius: 50%;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / 12px no-repeat,
        linear-gradient(180deg, #a02c43, #6d1526);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 2px 4px rgba(74, 14, 26, 0.4);
      transition: transform 0.2s ease;
    }

    .cat-grupo[open] summary::after {
      transform: rotate(180deg);
    }

    .cat-grupo[open] summary {
      border-radius: 17px 17px 0 0;
      box-shadow:
        inset 0 1px 0 #fff,
        inset 0 -2px 3px rgba(120, 90, 60, 0.12),
        0 2px 4px rgba(90, 64, 40, 0.25);
    }

    .fila-plato {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 0 rgba(120, 90, 60, 0.14);
    }

    .fila-plato:first-of-type {
      box-shadow: none;
    }

    .fila-oculta .fila-info {
      opacity: 0.55;
    }

    .fila-info {
      flex: 1 1 200px;
      min-width: 0;
    }

    .fila-linea {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 2px 12px;
    }

    .fila-linea strong {
      font-family: 'Fraunces', serif;
      font-size: 1.02rem;
      color: var(--tinta);
      text-shadow: 0 1px 0 #fff;
    }

    .fila-precio {
      font-weight: 700;
      color: var(--oro);
      text-shadow: 0 1px 0 #fff;
    }

    .fila-desc {
      margin-top: 3px;
      font-size: 0.84rem;
      color: var(--tinta-suave);
    }

    .fila-plato .botones {
      margin: 0;
    }

    .fila-plato button.btn-editar,
    .fila-plato button.btn-eliminar {
      padding: 8px 13px;
      margin: 3px;
      font-size: 13px;
      border-radius: 11px;
    }

    /* ---------- Interruptor físico (mostrar / ocultar) ---------- */
    .interruptor-caja {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 6px;
    }

    .interruptor {
      position: relative;
      width: 62px;
      height: 32px;
      margin: 2px;
      padding: 0;
      border-radius: 18px;
      border: 1px solid #bcae98;
      background: linear-gradient(180deg, #d6ccbb, #ece5d8);
      box-shadow:
        inset 0 3px 6px rgba(70, 48, 28, 0.4),
        0 1px 0 #fff;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .interruptor:active {
      transform: none;
    }

    .interruptor .perilla {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #e4dccd 70%, #cfc4b1 100%);
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.35),
        inset 0 -2px 3px rgba(0, 0, 0, 0.12);
      transition: left 0.2s ease;
    }

    .interruptor.on {
      border-color: var(--vino-oscuro);
      background: linear-gradient(180deg, #4d0c19, #8f2a3f);
      box-shadow:
        inset 0 3px 6px rgba(0, 0, 0, 0.5),
        0 1px 0 #fff,
        0 0 10px rgba(143, 42, 63, 0.35);
    }

    .interruptor.on .perilla {
      left: 32px;
    }

    @media (max-width: 460px) {
      .interruptor-texto {
        display: none;
      }

      .fila-plato button.btn-editar,
      .fila-plato button.btn-eliminar {
        padding: 8px 11px;
      }
    }

    .interruptor-texto {
      min-width: 50px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--tinta-suave);
      text-shadow: 0 1px 0 #fff;
    }

    /* =========================================================
       PANTALLA DE LOGIN
    ========================================================= */

    .pantalla-login {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 20px;
      background:
        var(--ruido),
        radial-gradient(circle at 20% 12%, rgba(230, 190, 130, 0.16), transparent 45%),
        linear-gradient(160deg, #3d0b16, #6d1526 55%, #7f2236);
      background-blend-mode: soft-light, normal, normal;
    }

    .login-marca {
      text-align: center;
    }

    /* Perilla / medallón metálico */
    .medallon {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fraunces', serif;
      font-size: 1.9rem;
      font-weight: 700;
      font-style: italic;
      color: var(--vino);
      text-shadow: 0 1px 0 #fff, 0 -1px 0 rgba(0, 0, 0, 0.12);
      background:
        radial-gradient(circle at 34% 28%, #ffffff 0%, #f1e9db 38%, #d8ccb8 78%, #c4b69f 100%);
      border: 1px solid #b7a78e;
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.9),
        inset 0 -5px 8px rgba(100, 76, 50, 0.28),
        0 0 0 6px rgba(255, 255, 255, 0.08),
        0 0 0 7px rgba(0, 0, 0, 0.3),
        0 14px 24px rgba(0, 0, 0, 0.45);
    }

    .login-marca h1 {
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      box-shadow: none;
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      color: #fff;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .login-marca p {
      margin: 6px 0 0;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      color: #e2c79c;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.4);
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 370px;
      padding: 34px 28px 28px;
      border-radius: 24px;
      border: 1px solid #fff;
      background:
        var(--ruido),
        linear-gradient(160deg, #ffffff 0%, #f5efe4 55%, #e9dfcf 100%);
      background-blend-mode: multiply, normal;
      box-shadow:
        inset 0 1px 0 #fff,
        inset 0 -3px 6px rgba(120, 90, 60, 0.15),
        0 2px 0 rgba(255, 255, 255, 0.25),
        0 22px 40px rgba(15, 3, 8, 0.55);
    }

    .login-card h2 {
      text-align: center;
      font-size: 1.25rem;
      margin-bottom: 18px;
    }

    .login-card .btn-principal {
      width: 100%;
      margin: 14px 0 6px;
      padding: 14px;
      font-size: 15px;
    }

    #mensaje {
      text-align: center;
      min-height: 1.3em;
      color: #a3182f;
    }

    /* Tornillos en las esquinas */
    .tornillo {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #cbbfab 70%, #a99b85);
      box-shadow:
        inset 0 -1px 1px rgba(0, 0, 0, 0.25),
        0 1px 0 rgba(255, 255, 255, 0.9),
        0 0 0 1px rgba(120, 95, 65, 0.35);
    }

    .tornillo::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 50%;
      height: 1.5px;
      margin-top: -0.75px;
      background: rgba(70, 50, 30, 0.55);
      transform: rotate(35deg);
    }

    .tornillo.t1 { top: 12px; left: 12px; }
    .tornillo.t2 { top: 12px; right: 12px; }
    .tornillo.t3 { bottom: 12px; left: 12px; }
    .tornillo.t4 { bottom: 12px; right: 12px; }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="pantalla-login">

    <div class="login-marca">
      <div class="medallon">AL</div>
      <h1>Alto Lavalle</h1>
      <p>Panel de administración</p>
    </div>

    <div class="login-card">
      <i class="tornillo t1"></i><i class="tornillo t2"></i><i class="tornillo t3"></i><i class="tornillo t4"></i>

      <h2>Iniciar sesión</h2>

      <label for="email">Correo</label>
      <input
        type="email"
        id="email"
        placeholder="tu@correo.com"
        autocomplete="username"
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
      >

      <button id="loginBtn" class="btn-principal">
        Iniciar sesión
      </button>

      <p id="mensaje"></p>

    </div>

  </div>


  <div class="contenedor">

    <!-- PANEL -->
    <div id="panel" style="display:none;">

      <h1>Alto Lavalle - Administración</h1>

      <!-- DATOS DEL NEGOCIO -->
      <div class="tarjeta">

        <h2>Datos del negocio</h2>

        <label for="nombreNegocio">Nombre</label>
        <input
          type="text"
          id="nombreNegocio"
          placeholder="Nombre del negocio"
        >

        <label for="direccion">Dirección</label>
        <input
          type="text"
          id="direccion"
          placeholder="Dirección"
        >

        <label for="telefono">Teléfono</label>
        <input
          type="text"
          id="telefono"
          placeholder="Teléfono"
        >

        <label for="instagram">Instagram</label>
        <input
          type="text"
          id="instagram"
          placeholder="Instagram"
        >

        <label for="facebook">Facebook</label>
        <input
          type="text"
          id="facebook"
          placeholder="Facebook"
        >

        <label for="maps">Google Maps</label>
        <input
          type="text"
          id="maps"
          placeholder="Enlace de Google Maps"
        >

        <label for="horarios">Horarios</label>
        <textarea
          id="horarios"
          placeholder="Escribí los horarios del negocio"
        ></textarea>

        <button id="guardarNegocioBtn" class="btn-principal">
          Guardar cambios
        </button>

        <p id="mensajeNegocio"></p>

      </div>


      <!-- AGREGAR / EDITAR PLATO -->
      <div class="tarjeta">

        <h2 id="tituloFormulario">
          Agregar plato
        </h2>

        <label for="nombrePlato">Nombre del plato</label>
        <input
          type="text"
          id="nombrePlato"
          placeholder="Ejemplo: Tallarines con salsa"
        >

        <label for="descripcionPlato">Descripción</label>
        <textarea
          id="descripcionPlato"
          placeholder="Descripción del plato"
        ></textarea>

        <label for="categoriaPlato">Categoría</label>
        <select id="categoriaPlato">
          <option value="">Seleccionar categoría</option>
          <option value="pastas">Pastas</option>
          <option value="pizzas">Pizzas</option>
          <option value="minutas">Minutas</option>
          <option value="entradas">Entradas</option>
          <option value="ensaladas">Ensaladas</option>
          <option value="guarniciones">Guarniciones</option>
          <option value="salsas">Salsas</option>
          <option value="otros">Otros</option>
          <option value="kids">Kids</option>
        </select>

        <label for="precioPlato">Precio</label>
        <input
          type="number"
          id="precioPlato"
          placeholder="Ejemplo: 7500"
          min="0"
        >

        <button id="guardarPlatoBtn" class="btn-principal">
          Agregar plato
        </button>

        <button
          id="cancelarEdicionBtn"
          class="btn-secundario"
          style="display:none;"
        >
          Cancelar edición
        </button>

        <p id="mensajePlato"></p>

      </div>


      <!-- LISTA DE PLATOS -->
      <div class="tarjeta">

        <h2>Platos del menú</h2>

        <input
          type="search"
          id="buscarPlato"
          placeholder="Buscar plato..."
        >

        <div id="listaPlatos">
          Cargando platos...
        </div>

      </div>


      <!-- CERRAR SESIÓN -->
      <div class="tarjeta">

        <button id="logoutBtn" class="btn-secundario">
          Cerrar sesión
        </button>

      </div>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      addDoc,
      getDocs,
      updateDoc,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyCNtM4PrMfiR_lU2ddi3gsvzJn4WfMxNKQ",
      authDomain: "alto-lavalle.firebaseapp.com",
      projectId: "alto-lavalle",
      storageBucket: "alto-lavalle.firebasestorage.app",
      messagingSenderId: "467411113937",
      appId: "1:467411113937:web:a60916344447f66fddb2f0"
    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // =========================
    // ELEMENTOS
    // =========================

    const login = document.getElementById("login");
    const panel = document.getElementById("panel");

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const mensaje = document.getElementById("mensaje");

    const nombreNegocio = document.getElementById("nombreNegocio");
    const direccion = document.getElementById("direccion");
    const telefono = document.getElementById("telefono");
    const instagram = document.getElementById("instagram");
    const facebook = document.getElementById("facebook");
    const maps = document.getElementById("maps");
    const horarios = document.getElementById("horarios");

    const guardarNegocioBtn =
      document.getElementById("guardarNegocioBtn");

    const mensajeNegocio =
      document.getElementById("mensajeNegocio");

    const nombrePlato =
      document.getElementById("nombrePlato");

    const descripcionPlato =
      document.getElementById("descripcionPlato");

    const categoriaPlato =
      document.getElementById("categoriaPlato");

    const precioPlato =
      document.getElementById("precioPlato");

    const guardarPlatoBtn =
      document.getElementById("guardarPlatoBtn");

    const cancelarEdicionBtn =
      document.getElementById("cancelarEdicionBtn");

    const tituloFormulario =
      document.getElementById("tituloFormulario");

    const mensajePlato =
      document.getElementById("mensajePlato");

    const listaPlatos =
      document.getElementById("listaPlatos");


    // ID del plato que estamos editando
    let platoEditandoId = null;


    // =========================
    // LOGIN
    // =========================

    loginBtn.addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        mensaje.textContent =
          "Completá el correo y la contraseña.";
        return;
      }

      mensaje.textContent =
        "Conectando con Firebase...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        mensaje.textContent =
          "Login correcto.";

      } catch (error) {

        console.error(error);

        mensaje.textContent =
          "Error: " + error.code;
      }

    });


    // =========================
    // ESTADO DE AUTENTICACIÓN
    // =========================

    onAuthStateChanged(auth, async (user) => {

      if (user) {

        login.style.display = "none";
        panel.style.display = "block";

        await cargarDatosNegocio();
        await cargarPlatos();

      } else {

        login.style.display = "flex";
        panel.style.display = "none";

      }

    });


    // =========================
    // CERRAR SESIÓN
    // =========================

    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);

      }

    });


    // =========================
    // CARGAR DATOS NEGOCIO
    // =========================

    async function cargarDatosNegocio() {

      try {

        const referencia =
          doc(db, "config", "negocio");

        const resultado =
          await getDoc(referencia);

        if (resultado.exists()) {

          const datos = resultado.data();

          nombreNegocio.value =
            datos.nombre || "";

          direccion.value =
            datos.direccion || "";

          telefono.value =
            datos.telefono || "";

          instagram.value =
            datos.instagram || "";

          facebook.value =
            datos.facebook || "";

          maps.value =
            datos.maps || "";

          horarios.value =
            datos.horarios || "";

        }

      } catch (error) {

        console.error(
          "Error cargando negocio:",
          error
        );

      }

    }


    // =========================
    // GUARDAR NEGOCIO
    // =========================

    guardarNegocioBtn.addEventListener("click", async () => {

      mensajeNegocio.textContent =
        "Guardando...";

      try {

        await setDoc(
          doc(db, "config", "negocio"),
          {
            nombre: nombreNegocio.value.trim(),
            direccion: direccion.value.trim(),
            telefono: telefono.value.trim(),
            instagram: instagram.value.trim(),
            facebook: facebook.value.trim(),
            maps: maps.value.trim(),
            horarios: horarios.value.trim()
          },
          {
            merge: true
          }
        );

        mensajeNegocio.textContent =
          "Cambios guardados correctamente.";

      } catch (error) {

        console.error(error);

        mensajeNegocio.textContent =
          "Error al guardar: " + error.code;
      }

    });


    // =========================
    // AGREGAR / EDITAR PLATO
    // =========================

    guardarPlatoBtn.addEventListener("click", async () => {

      const nombre =
        nombrePlato.value.trim();

      const descripcion =
        descripcionPlato.value.trim();

      const categoria =
        categoriaPlato.value;

      const precioTexto =
        precioPlato.value.trim();


      if (!nombre) {

        mensajePlato.textContent =
          "Escribí el nombre del plato.";

        return;
      }

      if (!categoria) {

        mensajePlato.textContent =
          "Seleccioná una categoría.";

        return;
      }


      let precio = null;

      if (precioTexto !== "") {

        precio = Number(precioTexto);

        if (Number.isNaN(precio)) {

          mensajePlato.textContent =
            "El precio no es válido.";

          return;
        }

      }


      const datosPlato = {

        nombre: nombre,

        descripcion: descripcion,

        categoria: categoria,

        precio: precio

      };


      mensajePlato.textContent =
        "Guardando...";


      try {

        // EDITAR
        if (platoEditandoId !== null) {

          await updateDoc(
            doc(db, "menu", platoEditandoId),
            datosPlato
          );

          mensajePlato.textContent =
            "Plato actualizado correctamente.";

        }

        // AGREGAR
        else {

          await addDoc(
            collection(db, "menu"),
            {
              ...datosPlato,
              activo: true
            }
          );

          mensajePlato.textContent =
            "Plato agregado correctamente.";
        }


        limpiarFormulario();

        await cargarPlatos();


      } catch (error) {

        console.error(error);

        mensajePlato.textContent =
          "Error: " + error.code;
      }

    });


    // =========================
    // CANCELAR EDICIÓN
    // =========================

    cancelarEdicionBtn.addEventListener(
      "click",
      () => {

        limpiarFormulario();

        mensajePlato.textContent = "";

      }
    );


    // =========================
    // LIMPIAR FORMULARIO
    // =========================

    function limpiarFormulario() {

      nombrePlato.value = "";
      descripcionPlato.value = "";
      categoriaPlato.value = "";
      precioPlato.value = "";

      platoEditandoId = null;

      tituloFormulario.textContent =
        "Agregar plato";

      guardarPlatoBtn.textContent =
        "Agregar plato";

      cancelarEdicionBtn.style.display =
        "none";

    }


    // =========================
    // CARGAR PLATOS (agrupados por categoría)
    // =========================

    const CATEGORIAS = [
      ["pastas", "Pastas"],
      ["pizzas", "Pizzas"],
      ["minutas", "Minutas"],
      ["entradas", "Entradas"],
      ["ensaladas", "Ensaladas"],
      ["guarniciones", "Guarniciones"],
      ["salsas", "Salsas"],
      ["otros", "Otros platos"],
      ["kids", "Menú kids"]
    ];

    const buscarPlato =
      document.getElementById("buscarPlato");

    let platosCache = [];

    // categorías que están abiertas (para que no se cierren al editar)
    const categoriasAbiertas = new Set();

    buscarPlato.addEventListener("input", renderPlatos);


    async function cargarPlatos() {

      listaPlatos.textContent =
        "Cargando platos...";

      try {

        const resultado =
          await getDocs(collection(db, "menu"));

        platosCache = [];

        resultado.forEach((documento) => {

          platosCache.push({
            id: documento.id,
            datos: documento.data()
          });

        });

        renderPlatos();

      } catch (error) {

        console.error(
          "Error cargando platos:",
          error
        );

        listaPlatos.textContent =
          "Error al cargar los platos.";

      }

    }


    function ordenDe(plato) {

      return typeof plato.datos.orden === "number"
        ? plato.datos.orden
        : 9999;

    }


    function renderPlatos() {

      listaPlatos.innerHTML = "";

      if (platosCache.length === 0) {

        listaPlatos.textContent =
          "No hay platos cargados.";

        return;
      }

      const filtro =
        buscarPlato.value.trim().toLowerCase();

      const grupos = {};

      platosCache.forEach((plato) => {

        const nombre =
          (plato.datos.nombre || "").toLowerCase();

        const descripcion =
          (plato.datos.descripcion || "").toLowerCase();

        if (
          filtro &&
          !nombre.includes(filtro) &&
          !descripcion.includes(filtro)
        ) {
          return;
        }

        const cat =
          plato.datos.categoria || "sin-categoria";

        if (!grupos[cat]) {
          grupos[cat] = [];
        }

        grupos[cat].push(plato);

      });

      const ordenCategorias =
        CATEGORIAS.map((c) => c[0]);

      Object.keys(grupos).forEach((c) => {
        if (!ordenCategorias.includes(c)) {
          ordenCategorias.push(c);
        }
      });

      const nombresCategorias =
        Object.fromEntries(CATEGORIAS);

      nombresCategorias["sin-categoria"] =
        "Sin categoría";

      let hayResultados = false;

      ordenCategorias.forEach((cat) => {

        const items = grupos[cat];

        if (!items || items.length === 0) {
          return;
        }

        hayResultados = true;

        items.sort((a, b) =>
          (ordenDe(a) - ordenDe(b)) ||
          (a.datos.nombre || "").localeCompare(
            b.datos.nombre || "",
            "es"
          )
        );

        const grupo =
          document.createElement("details");

        grupo.className = "cat-grupo";

        grupo.open =
          filtro !== "" || categoriasAbiertas.has(cat);

        grupo.addEventListener("toggle", () => {

          if (filtro !== "") {
            return;
          }

          if (grupo.open) {
            categoriasAbiertas.add(cat);
          } else {
            categoriasAbiertas.delete(cat);
          }

        });

        const ocultos =
          items.filter((p) => p.datos.activo !== true).length;

        const resumen =
          document.createElement("summary");

        resumen.textContent =
          (nombresCategorias[cat] || cat) +
          " (" + items.length + ")" +
          (ocultos > 0
            ? " · " + ocultos +
              (ocultos === 1 ? " oculto" : " ocultos")
            : "");

        grupo.appendChild(resumen);

        items.forEach((plato) => {
          grupo.appendChild(
            crearFilaPlato(plato.id, plato.datos)
          );
        });

        listaPlatos.appendChild(grupo);

      });

      if (!hayResultados) {

        listaPlatos.textContent =
          "No se encontraron platos.";

      }

    }


    function crearFilaPlato(id, datos) {

      const activo = datos.activo === true;

      const fila =
        document.createElement("div");

      fila.className =
        "fila-plato" + (activo ? "" : " fila-oculta");


      const info =
        document.createElement("div");

      info.className = "fila-info";


      const linea =
        document.createElement("div");

      linea.className = "fila-linea";


      const nombre =
        document.createElement("strong");

      nombre.textContent =
        datos.nombre || "Sin nombre";


      const precio =
        document.createElement("span");

      precio.className = "fila-precio";

      precio.textContent =
        (datos.precio !== null && datos.precio !== undefined)
          ? "$" + Number(datos.precio).toLocaleString("es-AR")
          : "Consultar";


      linea.appendChild(nombre);
      linea.appendChild(precio);

      info.appendChild(linea);


      if (datos.descripcion) {

        const descripcion =
          document.createElement("div");

        descripcion.className = "fila-desc";

        descripcion.textContent =
          datos.descripcion;

        info.appendChild(descripcion);

      }


      const botones =
        document.createElement("div");

      botones.className = "botones";


      // EDITAR
      const editarBtn =
        document.createElement("button");

      editarBtn.textContent = "Editar";
      editarBtn.className = "btn-editar";

      editarBtn.addEventListener("click", () => {
        cargarPlatoEnFormulario(id, datos);
      });


      // MOSTRAR / OCULTAR (interruptor)
      const interruptorCaja =
        document.createElement("div");

      interruptorCaja.className = "interruptor-caja";

      const estadoBtn =
        document.createElement("button");

      estadoBtn.className =
        "interruptor" + (activo ? " on" : "");

      estadoBtn.setAttribute("role", "switch");

      estadoBtn.setAttribute(
        "aria-checked",
        activo ? "true" : "false"
      );

      estadoBtn.setAttribute(
        "aria-label",
        activo ? "Ocultar plato" : "Mostrar plato"
      );

      const perilla =
        document.createElement("span");

      perilla.className = "perilla";

      estadoBtn.appendChild(perilla);

      const etiquetaEstado =
        document.createElement("span");

      etiquetaEstado.className = "interruptor-texto";

      etiquetaEstado.textContent =
        activo ? "Visible" : "Oculto";

      interruptorCaja.appendChild(estadoBtn);
      interruptorCaja.appendChild(etiquetaEstado);

      estadoBtn.addEventListener("click", async () => {
        estadoBtn.classList.toggle("on");
        await cambiarEstadoPlato(id, activo);
      });


      // ELIMINAR
      const eliminarBtn =
        document.createElement("button");

      eliminarBtn.textContent = "Eliminar";
      eliminarBtn.className = "btn-eliminar";

      eliminarBtn.addEventListener("click", async () => {
        await eliminarPlato(id);
      });


      botones.appendChild(interruptorCaja);
      botones.appendChild(editarBtn);
      botones.appendChild(eliminarBtn);

      fila.appendChild(info);
      fila.appendChild(botones);

      return fila;

    }


    // =========================
    // CARGAR PLATO PARA EDITAR
    // =========================

    function cargarPlatoEnFormulario(id, datos) {

      platoEditandoId = id;

      nombrePlato.value =
        datos.nombre || "";

      descripcionPlato.value =
        datos.descripcion || "";

      categoriaPlato.value =
        datos.categoria || "";

      if (
        datos.precio !== null &&
        datos.precio !== undefined
      ) {

        precioPlato.value = datos.precio;

      } else {

        precioPlato.value = "";

      }

      tituloFormulario.textContent =
        "Editar plato";

      guardarPlatoBtn.textContent =
        "Guardar cambios";

      cancelarEdicionBtn.style.display =
        "inline-block";

      mensajePlato.textContent = "";

      window.scrollTo({ top: 0, behavior: "smooth" });

    }


    // =========================
    // ACTIVAR / OCULTAR PLATO
    // =========================

    async function cambiarEstadoPlato(id, estadoActual) {

      try {

        await updateDoc(
          doc(db, "menu", id),
          {
            activo: !estadoActual
          }
        );

        await cargarPlatos();

      } catch (error) {

        console.error(error);

        alert("Error al cambiar el estado: " + error.code);

      }

    }


    // =========================
    // ELIMINAR PLATO
    // =========================

    async function eliminarPlato(id) {

      const confirmar = confirm(
        "¿Seguro que querés eliminar este plato? Esta acción no se puede deshacer."
      );

      if (!confirmar) {
        return;
      }

      try {

        await deleteDoc(
          doc(db, "menu", id)
        );

        await cargarPlatos();

      } catch (error) {

        console.error(error);

        alert("Error al eliminar el plato: " + error.code);

      }

    }

  </script>

</body>
</html>
