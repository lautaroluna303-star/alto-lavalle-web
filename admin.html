<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alto Lavalle - Administración</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Work Sans', Arial, sans-serif;
      background: #f4f1ed;
      color: #333;
    }

    h1, h2, h3 {
      font-family: 'Fraunces', serif;
    }

    .contenedor {
      width: 100%;
      max-width: 950px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      color: #651c2c;
      margin-bottom: 5px;
    }

    h2 {
      color: #651c2c;
      margin-top: 0;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      margin: 4px;
    }

    .btn-principal {
      background: #651c2c;
      color: white;
    }

    .btn-secundario {
      background: #777;
      color: white;
    }

    .btn-editar {
      background: #d49b32;
      color: white;
    }

    .btn-estado {
      background: #555;
      color: white;
    }

    .btn-eliminar {
      background: #a12626;
      color: white;
    }

    .plato {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .plato h3 {
      margin: 0 0 5px 0;
      color: #651c2c;
    }

    .plato p {
      margin: 5px 0;
    }

    .activo {
      color: green;
      font-weight: bold;
    }

    .inactivo {
      color: #a12626;
      font-weight: bold;
    }

    #mensaje {
      font-weight: bold;
      margin-top: 10px;
    }

    .botones {
      margin-top: 10px;
    }

    .separador {
      border: none;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }

    /* =========================
       PANTALLA DE LOGIN
    ========================= */

    .pantalla-login {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 20px;
      background:
        radial-gradient(circle at 20% 15%, rgba(214,174,110,0.14), transparent 45%),
        linear-gradient(160deg, #4a1420, #651c2c 55%, #7a2436);
    }

    .login-marca {
      text-align: center;
      color: #f4e9d8;
    }

    .login-marca .marca-linea {
      width: 46px;
      height: 2px;
      background: #d49b32;
      margin: 0 auto 16px;
    }

    .login-marca h1 {
      color: #ffffff;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 600;
      letter-spacing: 0.3px;
      margin: 0;
    }

    .login-marca p {
      margin: 8px 0 0;
      font-size: 0.9rem;
      color: #d9b98c;
      letter-spacing: 0.4px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: #fffdfa;
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 18px 40px rgba(20, 6, 10, 0.35);
    }

    .login-card h2 {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 22px;
    }

    .login-card label {
      font-family: 'Work Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: #7a6f68;
      margin-top: 4px;
    }

    .login-card input {
      border: 1px solid #e3d9cc;
      background: #faf8f4;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .login-card input:focus {
      outline: none;
      border-color: #d49b32;
      box-shadow: 0 0 0 3px rgba(212, 155, 50, 0.18);
      background: #fff;
    }

    .login-card .btn-principal {
      width: 100%;
      padding: 12px;
      margin: 10px 0 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .login-card .btn-principal:hover {
      background: #7a2436;
    }

    #mensaje {
      text-align: center;
      min-height: 1.2em;
      color: #a12626;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="pantalla-login">

    <div class="login-marca">
      <div class="marca-linea"></div>
      <h1>Alto Lavalle</h1>
      <p>Panel de administración</p>
    </div>

    <div class="login-card">

      <h2>Iniciar sesión</h2>

      <label for="email">Correo</label>
      <input
        type="email"
        id="email"
        placeholder="tu@correo.com"
        autocomplete="username"
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
      >

      <button id="loginBtn" class="btn-principal">
        Iniciar sesión
      </button>

      <p id="mensaje"></p>

    </div>

  </div>


  <div class="contenedor">

    <!-- PANEL -->
    <div id="panel" style="display:none;">

      <h1>Alto Lavalle - Administración</h1>

      <!-- DATOS DEL NEGOCIO -->
      <div class="tarjeta">

        <h2>Datos del negocio</h2>

        <label for="nombreNegocio">Nombre</label>
        <input
          type="text"
          id="nombreNegocio"
          placeholder="Nombre del negocio"
        >

        <label for="direccion">Dirección</label>
        <input
          type="text"
          id="direccion"
          placeholder="Dirección"
        >

        <label for="telefono">Teléfono</label>
        <input
          type="text"
          id="telefono"
          placeholder="Teléfono"
        >

        <label for="instagram">Instagram</label>
        <input
          type="text"
          id="instagram"
          placeholder="Instagram"
        >

        <label for="facebook">Facebook</label>
        <input
          type="text"
          id="facebook"
          placeholder="Facebook"
        >

        <label for="maps">Google Maps</label>
        <input
          type="text"
          id="maps"
          placeholder="Enlace de Google Maps"
        >

        <label for="horarios">Horarios</label>
        <textarea
          id="horarios"
          placeholder="Escribí los horarios del negocio"
        ></textarea>

        <button id="guardarNegocioBtn" class="btn-principal">
          Guardar cambios
        </button>

        <p id="mensajeNegocio"></p>

      </div>


      <!-- AGREGAR / EDITAR PLATO -->
      <div class="tarjeta">

        <h2 id="tituloFormulario">
          Agregar plato
        </h2>

        <label for="nombrePlato">Nombre del plato</label>
        <input
          type="text"
          id="nombrePlato"
          placeholder="Ejemplo: Tallarines con salsa"
        >

        <label for="descripcionPlato">Descripción</label>
        <textarea
          id="descripcionPlato"
          placeholder="Descripción del plato"
        ></textarea>

        <label for="categoriaPlato">Categoría</label>
        <select id="categoriaPlato">
          <option value="">Seleccionar categoría</option>
          <option value="pastas">Pastas</option>
          <option value="pizzas">Pizzas</option>
          <option value="minutas">Minutas</option>
          <option value="entradas">Entradas</option>
          <option value="ensaladas">Ensaladas</option>
          <option value="guarniciones">Guarniciones</option>
          <option value="salsas">Salsas</option>
          <option value="otros">Otros</option>
          <option value="kids">Kids</option>
        </select>

        <label for="precioPlato">Precio</label>
        <input
          type="number"
          id="precioPlato"
          placeholder="Ejemplo: 7500"
          min="0"
        >

        <button id="guardarPlatoBtn" class="btn-principal">
          Agregar plato
        </button>

        <button
          id="cancelarEdicionBtn"
          class="btn-secundario"
          style="display:none;"
        >
          Cancelar edición
        </button>

        <p id="mensajePlato"></p>

      </div>


      <!-- LISTA DE PLATOS -->
      <div class="tarjeta">

        <h2>Platos del menú</h2>

        <div id="listaPlatos">
          Cargando platos...
        </div>

      </div>


      <!-- CERRAR SESIÓN -->
      <div class="tarjeta">

        <button id="logoutBtn" class="btn-secundario">
          Cerrar sesión
        </button>

      </div>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      addDoc,
      getDocs,
      updateDoc,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyCNtM4PrMfiR_lU2ddi3gsvzJn4WfMxNKQ",
      authDomain: "alto-lavalle.firebaseapp.com",
      projectId: "alto-lavalle",
      storageBucket: "alto-lavalle.firebasestorage.app",
      messagingSenderId: "467411113937",
      appId: "1:467411113937:web:a60916344447f66fddb2f0"
    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // =========================
    // ELEMENTOS
    // =========================

    const login = document.getElementById("login");
    const panel = document.getElementById("panel");

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const mensaje = document.getElementById("mensaje");

    const nombreNegocio = document.getElementById("nombreNegocio");
    const direccion = document.getElementById("direccion");
    const telefono = document.getElementById("telefono");
    const instagram = document.getElementById("instagram");
    const facebook = document.getElementById("facebook");
    const maps = document.getElementById("maps");
    const horarios = document.getElementById("horarios");

    const guardarNegocioBtn =
      document.getElementById("guardarNegocioBtn");

    const mensajeNegocio =
      document.getElementById("mensajeNegocio");

    const nombrePlato =
      document.getElementById("nombrePlato");

    const descripcionPlato =
      document.getElementById("descripcionPlato");

    const categoriaPlato =
      document.getElementById("categoriaPlato");

    const precioPlato =
      document.getElementById("precioPlato");

    const guardarPlatoBtn =
      document.getElementById("guardarPlatoBtn");

    const cancelarEdicionBtn =
      document.getElementById("cancelarEdicionBtn");

    const tituloFormulario =
      document.getElementById("tituloFormulario");

    const mensajePlato =
      document.getElementById("mensajePlato");

    const listaPlatos =
      document.getElementById("listaPlatos");


    // ID del plato que estamos editando
    let platoEditandoId = null;


    // =========================
    // LOGIN
    // =========================

    loginBtn.addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        mensaje.textContent =
          "Completá el correo y la contraseña.";
        return;
      }

      mensaje.textContent =
        "Conectando con Firebase...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        mensaje.textContent =
          "Login correcto.";

      } catch (error) {

        console.error(error);

        mensaje.textContent =
          "Error: " + error.code;
      }

    });


    // =========================
    // ESTADO DE AUTENTICACIÓN
    // =========================

    onAuthStateChanged(auth, async (user) => {

      if (user) {

        login.style.display = "none";
        panel.style.display = "block";

        await cargarDatosNegocio();
        await cargarPlatos();

      } else {

        login.style.display = "flex";
        panel.style.display = "none";

      }

    });


    // =========================
    // CERRAR SESIÓN
    // =========================

    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);

      }

    });


    // =========================
    // CARGAR DATOS NEGOCIO
    // =========================

    async function cargarDatosNegocio() {

      try {

        const referencia =
          doc(db, "config", "negocio");

        const resultado =
          await getDoc(referencia);

        if (resultado.exists()) {

          const datos = resultado.data();

          nombreNegocio.value =
            datos.nombre || "";

          direccion.value =
            datos.direccion || "";

          telefono.value =
            datos.telefono || "";

          instagram.value =
            datos.instagram || "";

          facebook.value =
            datos.facebook || "";

          maps.value =
            datos.maps || "";

          horarios.value =
            datos.horarios || "";

        }

      } catch (error) {

        console.error(
          "Error cargando negocio:",
          error
        );

      }

    }


    // =========================
    // GUARDAR NEGOCIO
    // =========================

    guardarNegocioBtn.addEventListener("click", async () => {

      mensajeNegocio.textContent =
        "Guardando...";

      try {

        await setDoc(
          doc(db, "config", "negocio"),
          {
            nombre: nombreNegocio.value.trim(),
            direccion: direccion.value.trim(),
            telefono: telefono.value.trim(),
            instagram: instagram.value.trim(),
            facebook: facebook.value.trim(),
            maps: maps.value.trim(),
            horarios: horarios.value.trim()
          },
          {
            merge: true
          }
        );

        mensajeNegocio.textContent =
          "Cambios guardados correctamente.";

      } catch (error) {

        console.error(error);

        mensajeNegocio.textContent =
          "Error al guardar: " + error.code;
      }

    });


    // =========================
    // AGREGAR / EDITAR PLATO
    // =========================

    guardarPlatoBtn.addEventListener("click", async () => {

      const nombre =
        nombrePlato.value.trim();

      const descripcion =
        descripcionPlato.value.trim();

      const categoria =
        categoriaPlato.value;

      const precioTexto =
        precioPlato.value.trim();


      if (!nombre) {

        mensajePlato.textContent =
          "Escribí el nombre del plato.";

        return;
      }

      if (!categoria) {

        mensajePlato.textContent =
          "Seleccioná una categoría.";

        return;
      }


      let precio = null;

      if (precioTexto !== "") {

        precio = Number(precioTexto);

        if (Number.isNaN(precio)) {

          mensajePlato.textContent =
            "El precio no es válido.";

          return;
        }

      }


      const datosPlato = {

        nombre: nombre,

        descripcion: descripcion,

        categoria: categoria,

        precio: precio

      };


      mensajePlato.textContent =
        "Guardando...";


      try {

        // EDITAR
        if (platoEditandoId !== null) {

          await updateDoc(
            doc(db, "menu", platoEditandoId),
            datosPlato
          );

          mensajePlato.textContent =
            "Plato actualizado correctamente.";

        }

        // AGREGAR
        else {

          await addDoc(
            collection(db, "menu"),
            {
              ...datosPlato,
              activo: true
            }
          );

          mensajePlato.textContent =
            "Plato agregado correctamente.";
        }


        limpiarFormulario();

        await cargarPlatos();


      } catch (error) {

        console.error(error);

        mensajePlato.textContent =
          "Error: " + error.code;
      }

    });


    // =========================
    // CANCELAR EDICIÓN
    // =========================

    cancelarEdicionBtn.addEventListener(
      "click",
      () => {

        limpiarFormulario();

        mensajePlato.textContent = "";

      }
    );


    // =========================
    // LIMPIAR FORMULARIO
    // =========================

    function limpiarFormulario() {

      nombrePlato.value = "";
      descripcionPlato.value = "";
      categoriaPlato.value = "";
      precioPlato.value = "";

      platoEditandoId = null;

      tituloFormulario.textContent =
        "Agregar plato";

      guardarPlatoBtn.textContent =
        "Agregar plato";

      cancelarEdicionBtn.style.display =
        "none";

    }


    // =========================
    // CARGAR PLATOS
    // =========================

    async function cargarPlatos() {

      listaPlatos.textContent =
        "Cargando platos...";


      try {

        const referencia =
          collection(db, "menu");

        const resultado =
          await getDocs(referencia);


        listaPlatos.innerHTML = "";


        if (resultado.empty) {

          listaPlatos.textContent =
            "No hay platos cargados.";

          return;
        }


        resultado.forEach((documento) => {

          const datos =
            documento.data();

          const id =
            documento.id;


          const contenedor =
            document.createElement("div");

          contenedor.className =
            "plato";


          const titulo =
            document.createElement("h3");

          titulo.textContent =
            datos.nombre || "Sin nombre";


          const descripcion =
            document.createElement("p");

          descripcion.textContent =
            datos.descripcion || "Sin descripción";


          const categoria =
            document.createElement("p");

          categoria.textContent =
            "Categoría: " +
            (datos.categoria || "Sin categoría");


          const precio =
            document.createElement("p");


          if (
            datos.precio !== null &&
            datos.precio !== undefined
          ) {

            precio.textContent =
              "Precio: $" +
              Number(datos.precio).toLocaleString(
                "es-AR"
              );

          } else {

            precio.textContent =
              "Precio: consultar";

          }


          const estado =
            document.createElement("p");


          if (datos.activo === true) {

            estado.textContent =
              "Estado: ACTIVO";

            estado.className =
              "activo";

          } else {

            estado.textContent =
              "Estado: OCULTO";

            estado.className =
              "inactivo";

          }


          const botones =
            document.createElement("div");

          botones.className =
            "botones";


          // EDITAR
          const editarBtn =
            document.createElement("button");

          editarBtn.textContent =
            "Editar";

          editarBtn.className =
            "btn-editar";


          editarBtn.addEventListener(
            "click",
            () => {

              cargarPlatoEnFormulario(
                id,
                datos
              );

            }
          );


          // ACTIVAR / DESACTIVAR
          const estadoBtn =
            document.createElement("button");

          if (datos.activo === true) {

            estadoBtn.textContent =
              "Ocultar";

          } else {

            estadoBtn.textContent =
              "Mostrar";

          }

          estadoBtn.className =
            "btn-estado";


          estadoBtn.addEventListener(
            "click",
            async () => {

              await cambiarEstadoPlato(
                id,
                datos.activo === true
              );

            }
          );


          // ELIMINAR
          const eliminarBtn =
            document.createElement("button");

          eliminarBtn.textContent =
            "Eliminar";

          eliminarBtn.className =
            "btn-eliminar";


          eliminarBtn.addEventListener(
            "click",
            async () => {

              await eliminarPlato(id);

            }
          );


          botones.appendChild(editarBtn);
          botones.appendChild(estadoBtn);
          botones.appendChild(eliminarBtn);

          contenedor.appendChild(titulo);
          contenedor.appendChild(descripcion);
          contenedor.appendChild(categoria);
          contenedor.appendChild(precio);
          contenedor.appendChild(estado);
          contenedor.appendChild(botones);

          listaPlatos.appendChild(contenedor);

        });


      } catch (error) {

        console.error(
          "Error cargando platos:",
          error
        );

        listaPlatos.textContent =
          "Error al cargar los platos.";

      }

    }


    // =========================
    // CARGAR PLATO PARA EDITAR
    // =========================

    function cargarPlatoEnFormulario(id, datos) {

      platoEditandoId = id;

      nombrePlato.value =
        datos.nombre || "";

      descripcionPlato.value =
        datos.descripcion || "";

      categoriaPlato.value =
        datos.categoria || "";

      if (
        datos.precio !== null &&
        datos.precio !== undefined
      ) {

        precioPlato.value = datos.precio;

      } else {

        precioPlato.value = "";

      }

      tituloFormulario.textContent =
        "Editar plato";

      guardarPlatoBtn.textContent =
        "Guardar cambios";

      cancelarEdicionBtn.style.display =
        "inline-block";

      mensajePlato.textContent = "";

      window.scrollTo({ top: 0, behavior: "smooth" });

    }


    // =========================
    // ACTIVAR / OCULTAR PLATO
    // =========================

    async function cambiarEstadoPlato(id, estadoActual) {

      try {

        await updateDoc(
          doc(db, "menu", id),
          {
            activo: !estadoActual
          }
        );

        await cargarPlatos();

      } catch (error) {

        console.error(error);

        alert("Error al cambiar el estado: " + error.code);

      }

    }


    // =========================
    // ELIMINAR PLATO
    // =========================

    async function eliminarPlato(id) {

      const confirmar = confirm(
        "¿Seguro que querés eliminar este plato? Esta acción no se puede deshacer."
      );

      if (!confirmar) {
        return;
      }

      try {

        await deleteDoc(
          doc(db, "menu", id)
        );

        await cargarPlatos();

      } catch (error) {

        console.error(error);

        alert("Error al eliminar el plato: " + error.code);

      }

    }

  </script>

</body>
</html>
